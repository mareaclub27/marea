<html lang="es" data-theme="dark" style="color-scheme: dark;"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marea Club | Shorts de baño</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F6F7;--card:#fff;--ink:#0E2A3B;--mute:#5B7281;--line:#D5E2E6;--sea:#0B7285;--sun:#FFC72C;--red:#E8504A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1A24;--card:#122A38;--ink:#EAF3F6;--mute:#93AAB6;--line:#23404F;--sea:#4FD1E0}}
:root[data-theme="dark"]{--bg:#0B1A24;--card:#122A38;--ink:#EAF3F6;--mute:#93AAB6;--line:#23404F;--sea:#4FD1E0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif;line-height:1.4}
.bar{background:var(--sun);color:#0E2A3B;text-align:center;font-weight:800;font-size:14px;padding:9px 12px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 5vw;background:var(--card);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:24px;letter-spacing:-.5px}
button,select,input{font:inherit;color:var(--ink)}
.pill{border:2px solid var(--ink);background:none;border-radius:99px;padding:6px 14px;font-weight:800;cursor:pointer}
main{max-width:1200px;margin:0 auto;padding:28px 5vw 110px}
h1{font-size:clamp(40px,8vw,84px);line-height:.95;letter-spacing:-2px;margin:8px 0 6px;font-weight:800}
.sub{color:var(--mute);margin:0 0 22px}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-block:1px solid var(--line);padding:14px 0;margin-bottom:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:8px;min-width:46px;padding:6px 10px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select,input{padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--card)}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:22px}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.img{aspect-ratio:4/5;position:relative;background:#9fb6c0 center/cover}
.cnt{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 8px;border-radius:99px}.tags{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--red);color:#fff}.tag.g{background:#fff;color:#0E2A3B}
.body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.name{font-weight:600;font-size:16px;margin:0}.old{color:var(--mute);text-decoration:line-through;font-size:14px;margin-right:6px}
.price{font-weight:800;font-size:20px}.trf{color:var(--sea);font-weight:800;font-size:14px}
.sz{display:flex;gap:5px;flex-wrap:wrap}.sz button{border:1.5px solid var(--line);background:none;font-size:13px;border-radius:6px;padding:3px 8px;cursor:pointer}
.sz button[aria-pressed=true]{background:var(--sea);border-color:var(--sea);color:#fff}
.add{margin-top:auto;border:0;background:var(--ink);color:var(--bg);font-weight:800;border-radius:10px;padding:12px;cursor:pointer}
.wa{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#25D366;color:#073B1C;font-weight:800;border:0;border-radius:99px;padding:14px 24px;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer}
.wa[hidden]{display:none}
#admin .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;overflow:auto;padding:4vw}
.pan{background:var(--card);max-width:760px;margin:0 auto;border-radius:14px;padding:20px}
.pan label{display:block;font-size:13px;color:var(--mute);margin:8px 0 2px}.pan input{width:100%}
.row{border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.thumb{width:64px;height:80px;object-fit:cover;border-radius:6px;background:#9fb6c0;display:block}
</style></head><body>

<script>
var D=JSON.parse(document.getElementById("data").textContent);D.items.forEach(function(x){x.imgs=x.imgs||(x.img?[x.img]:[])});var EDIT=false,flt=null,sort="new",cart=[],sel={};
var $=function(i){return document.getElementById(i)},F=function(n){return "$"+n.toLocaleString("es-AR")};
function E(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML}
function fin(x){return Math.round(x.p*(1-x.d/100))}
function render(){
  var o=D.items.filter(function(x){return !flt||x.s.indexOf(flt)>-1});
  if(sort=="asc")o.sort(function(a,b){return fin(a)-fin(b)});if(sort=="desc")o.sort(function(a,b){return fin(b)-fin(a)});
  var sz=[38,40,42,44,46,48].map(function(z){return '<button class="chip" data-z="'+z+'" aria-pressed="'+(z===flt)+'">'+z+'</button>'}).join("");
  $("app").innerHTML='<div class="bar">'+E(D.bar)+'</div><header><div class="logo">'+E(D.brand)+'</div>'+(EDIT?'<button class="pill" id="ed">Editar mi tienda</button>':'')+'</header><main><h1>Shorts de baño</h1><p class="sub">Elegí tu talle y hacé tu pedido por WhatsApp.</p><div class="tools"><div class="chips"><b>Talle</b>'+sz+'</div><select id="so"><option value="new">Más nuevo</option><option value="asc">Precio: menor a mayor</option><option value="desc">Precio: mayor a menor</option></select></div><div class="grid" id="gr"></div>'+(o.length?'':'<p class="sub">No hay shorts en ese talle por ahora.</p>')+'</main><button class="wa" id="send" hidden></button>';
  $("so").value=sort;$("so").onchange=function(){sort=this.value;render()};
  [].forEach.call(document.querySelectorAll(".chip"),function(b){b.onclick=function(){flt=flt===+b.dataset.z?null:+b.dataset.z;render()}});
  var g=$("gr");
  o.forEach(function(x){
    var z=sel[x.id]&&x.s.indexOf(sel[x.id])>-1?sel[x.id]:(x.s.indexOf(flt)>-1?flt:x.s[0]);sel[x.id]=z;
    var el=document.createElement("article");el.className="p";
    el.innerHTML='<div class="img"'+(x.imgs[0]?' style="background-image:url('+x.imgs[0]+')"':'')+'>'+(x.imgs.length>1?'<span class="cnt">1/'+x.imgs.length+'</span>':'')+'<div class="tags">'+(x.d?'<span class="tag">'+x.d+'% OFF</span>':'')+'<span class="tag g">Envío gratis</span></div></div><div class="body"><h2 class="name">'+E(x.n)+'</h2><div>'+(x.d?'<span class="old">'+F(x.p)+'</span>':'')+'<span class="price">'+F(fin(x))+'</span></div><div class="trf">'+F(Math.round(fin(x)*.75))+' con transferencia</div><div class="sz"></div><button class="add">Agregar al pedido</button></div>';
    var im=el.querySelector(".img"),k=0;if(x.imgs.length>1){im.style.cursor="pointer";im.onclick=function(){k=(k+1)%x.imgs.length;im.style.backgroundImage="url("+x.imgs[k]+")";im.querySelector(".cnt").textContent=(k+1)+"/"+x.imgs.length}}
    var s=el.querySelector(".sz");
    x.s.forEach(function(t){var b=document.createElement("button");b.textContent=t;b.setAttribute("aria-pressed",String(t===z));b.onclick=function(){sel[x.id]=t;[].forEach.call(s.children,function(c){c.setAttribute("aria-pressed",String(+c.textContent===t))})};s.appendChild(b)});
    el.querySelector(".add").onclick=function(){cart.push({n:x.n,z:sel[x.id],p:fin(x)});cartUI()};
    g.appendChild(el)});
  if($("ed"))$("ed").onclick=openAdmin;cartUI();
}
function cartUI(){var b=$("send");if(!b)return;b.hidden=!cart.length;var t=cart.reduce(function(a,c){return a+c.p},0);
  b.textContent="Enviar pedido por WhatsApp ("+cart.length+") · "+F(t);
  b.onclick=function(){var m="Hola! Quiero hacer este pedido:\n"+cart.map(function(c){return "- "+c.n+" talle "+c.z+" ("+F(c.p)+")"}).join("\n")+"\nTotal: "+F(t);
    window.open("https://wa.me/"+D.wa.replace(/\D/g,"")+"?text="+encodeURIComponent(m),"_blank")}}
function resize(f,cb){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var k=Math.min(1,700/i.width),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.75))};i.src=r.result};r.readAsDataURL(f)}
function openAdmin(){
  var h='<div class="ov"><div class="pan"><h2>Mi tienda</h2><label>Nombre de la marca</label><input id="a_b" value="'+E(D.brand).replace(/"/g,"&quot;")+'"><div class="g2"><div><label>WhatsApp (con código de país, ej. 5491122334455)</label><input id="a_w" value="'+E(D.wa)+'"></div><div><label>Mensaje de la barra superior</label><input id="a_bar" value="'+E(D.bar).replace(/"/g,"&quot;")+'"></div></div><h3>Productos</h3>';
  D.items.forEach(function(x,i){h+='<div class="row"><div class="g2"><div><label>Nombre</label><input data-i="'+i+'" data-k="n" value="'+E(x.n).replace(/"/g,"&quot;")+'"></div><div><label>Precio</label><input type="number" data-i="'+i+'" data-k="p" value="'+x.p+'"></div><div><label>Descuento %</label><input type="number" data-i="'+i+'" data-k="d" value="'+x.d+'"></div><div><label>Talles (separados por coma)</label><input data-i="'+i+'" data-k="s" value="'+x.s.join(",")+'"></div></div><label>Fotos (la primera es la principal)</label><div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px">'+x.imgs.map(function(u,j){return '<div style="position:relative"><img class="thumb" src="'+u+'"><button class="pill" data-rm="'+i+','+j+'" style="position:absolute;top:-6px;right:-6px;padding:0 7px">×</button></div>'}).join("")+'</div><input type="file" accept="image/*" multiple data-i="'+i+'" data-k="img"><div class="acts"><button class="pill" data-del="'+i+'">Borrar producto</button></div></div>'});
  h+='<div class="acts"><button class="pill" id="a_add">+ Agregar producto</button><button class="pill" id="a_save" style="background:var(--ink);color:var(--bg)">Guardar y publicar</button><button class="pill" id="a_x">Cancelar</button></div></div></div>';
  $("admin").innerHTML=h;
  $("a_x").onclick=function(){$("admin").innerHTML=""};
  $("a_add").onclick=function(){pull();D.items.push({id:Date.now(),n:"Nuevo producto",p:0,d:0,s:[40,42,44],imgs:[]});openAdmin()};
  [].forEach.call(document.querySelectorAll("[data-del]"),function(b){b.onclick=function(){pull();D.items.splice(+b.dataset.del,1);openAdmin()}});
  [].forEach.call(document.querySelectorAll('input[type=file]'),function(f){f.onchange=function(){pull();var fs=[].slice.call(f.files),i=+f.dataset.i;(function nx(){var a=fs.shift();if(!a)return openAdmin();resize(a,function(u){D.items[i].imgs.push(u);nx()})})()}});
  [].forEach.call(document.querySelectorAll("[data-rm]"),function(b){b.onclick=function(){pull();var p=b.dataset.rm.split(",");D.items[+p[0]].imgs.splice(+p[1],1);openAdmin()}});
  $("a_save").onclick=save;
}
function pull(){D.brand=$("a_b").value;D.wa=$("a_w").value;D.bar=$("a_bar").value;
  [].forEach.call(document.querySelectorAll("#admin input[data-k]"),function(i){var x=D.items[+i.dataset.i],k=i.dataset.k;
    if(k=="n")x.n=i.value;if(k=="p")x.p=+i.value||0;if(k=="d")x.d=Math.min(90,Math.max(0,+i.value||0));
    if(k=="s")x.s=i.value.split(",").map(function(v){return +v.trim()}).filter(Boolean)})}
async function save(){pull();var a=window.claude&&await claude.use("artifact");
  if(!a){alert("Solo podés guardar desde tu cuenta de Claude.");return}
  var c=document.documentElement.cloneNode(true);
  c.querySelector("#data").textContent=JSON.stringify(D).replace(/</g,"\\u003c");
  c.querySelector("#app").innerHTML="";c.querySelector("#admin").innerHTML="";
  try{await a.publish("<!DOCTYPE html>\n"+c.outerHTML)}catch(e){alert("No se pudo guardar: "+(e.code||e.message))}}
render();
(async function(){try{var u=window.claude&&await claude.use("user");if(u&&u.canEdit()){EDIT=true;render()}}catch(e){}})();
</script>
